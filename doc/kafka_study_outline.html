function renderItem([text, tag]) {
  const tagHtml = tag === 'hot' ? '<span class="tag-hot">高频</span>' :
                  tag === 'key' ? '<span class="tag-key">重点</span>' :
                  tag === 'new' ? '<span class="tag-new">新特性</span>' : '';
  return `<div class="item"><span>${text} ${tagHtml}</span></div>`;
}

function renderChapter(ch, idx) {
  const sections = ch.sections.map(s => `
    <div class="section">
      <div class="sec-title"><i class="ti ${s.icon}" aria-hidden="true"></i>${s.title}</div>
      <div class="items">${s.items.map(renderItem).join('')}</div>
    </div>
  `).join('<div class="divider"></div>');

  return `
    <div class="chapter" id="ch${idx}">
      <div class="ch-header" onclick="toggle(${idx})">
        <span class="ch-num badge ${ch.badgeClass}">${ch.num}</span>
        <span class="ch-title">${ch.title}</span>
        <span class="badge ${ch.badgeClass}">${ch.badge}</span>
        <span class="ch-meta">${ch.meta}</span>
        <i class="ti ti-chevron-down chevron" id="chv${idx}" aria-hidden="true"></i>
      </div>
      <div class="ch-body" id="body${idx}" style="display:none">${sections}</div>
    </div>
  `;
}

document.getElementById('chapters').innerHTML = data.map(renderChapter).join('');

function toggle(idx) {
  const body = document.getElementById('body' + idx);
  const chv = document.getElementById('chv' + idx);
  const open = body.style.display !== 'none';
  body.style.display = open ? 'none' : 'block';
  chv.classList.toggle('open', !open);
}

toggle(0);
