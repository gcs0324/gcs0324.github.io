<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Java 面试知识图谱</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/theme.css">
<style>

:root {
  --font-sans: 'Inter', system-ui, sans-serif;
  --font-mono: 'IBM Plex Mono', monospace;
  --border-radius-lg: 10px;
  --color-text-primary:    #1a1d23;
  --color-text-secondary:  #5a6272;
  --color-text-tertiary:   #9aa0ad;
  --color-border-tertiary: rgba(0,0,0,0.07);
  --color-border-secondary:rgba(0,0,0,0.13);
  --color-background-secondary: #f7f8fa;
  --color-background-tertiary:  #f0f2f5;
}
[data-theme="dark"] {
  --color-text-primary:    #dde4f0;
  --color-text-secondary:  #7d8fa8;
  --color-text-tertiary:   #3d4f63;
  --color-border-tertiary: rgba(255,255,255,0.07);
  --color-border-secondary:rgba(255,255,255,0.14);
  --color-background-secondary: #161b27;
  --color-background-tertiary:  #1e2535;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-background-secondary); color: var(--color-text-primary);
       font-family: var(--font-sans); min-height: 100vh; padding: 32px; }
</style>
<script src="../shared/theme.js"></script>
</head>
<body>

<style>
  :root { --gap: 10px; }
  .wrap { padding: 16px 0; font-family: var(--font-sans); }
  .title-bar { display:flex; align-items:center; gap:10px; margin-bottom:18px; }
  .title-bar h2 { font-size:18px; font-weight:500; color:var(--color-text-primary); margin:0; }
  .badge { font-size:11px; padding:3px 8px; border-radius:20px; font-weight:500; }
  .grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap:14px; }
  .card { border-radius:var(--border-radius-lg); border:0.5px solid var(--color-border-tertiary); background:var(--color-background-secondary); overflow:hidden; transition: box-shadow .15s; }
  .card:hover { border-color:var(--color-border-secondary); }
  .card-header { display:flex; align-items:center; gap:10px; padding:12px 14px 10px; cursor:pointer; user-select:none; }
  .card-icon { width:32px; height:32px; border-radius:8px; display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:16px; }
  .card-title { font-size:14px; font-weight:500; color:var(--color-text-primary); flex:1; }
  .card-count { font-size:11px; padding:2px 7px; border-radius:12px; }
  .chevron { font-size:12px; color:var(--color-text-tertiary); transition:transform .2s; }
  .chevron.open { transform:rotate(180deg); }
  .card-body { padding:0 14px 12px; display:none; }
  .card-body.open { display:block; }
  .sub-list { list-style:none; margin:0; padding:0; }
  .sub-list li { display:flex; align-items:flex-start; gap:8px; padding:5px 0; border-bottom:0.5px solid var(--color-border-tertiary); font-size:13px; color:var(--color-text-secondary); line-height:1.45; }
  .sub-list li:last-child { border-bottom:none; }
  .dot { width:6px; height:6px; border-radius:50%; flex-shrink:0; margin-top:5px; }

  .c1 .card-icon { background:#EEEDFE; color:#534AB7; }
  .c2 .card-icon { background:#E1F5EE; color:#0F6E56; }
  .c3 .card-icon { background:#E6F1FB; color:#185FA5; }
  .c4 .card-icon { background:#FAEEDA; color:#854F0B; }
  .c5 .card-icon { background:#FAECE7; color:#993C1D; }
  .c6 .card-icon { background:#FBEAF0; color:#993556; }
  .c7 .card-icon { background:#EAF3DE; color:#3B6D11; }
  .c8 .card-icon { background:#FCEBEB; color:#A32D2D; }
  .c9 .card-icon { background:#F1EFE8; color:#5F5E5A; }
  .c10 .card-icon { background:#E1F5EE; color:#085041; }
  .c11 .card-icon { background:#EEEDFE; color:#3C3489; }
  .c12 .card-icon { background:#FAEEDA; color:#633806; }

  .c1 .card-count { background:#EEEDFE; color:#534AB7; }
  .c2 .card-count { background:#E1F5EE; color:#0F6E56; }
  .c3 .card-count { background:#E6F1FB; color:#185FA5; }
  .c4 .card-count { background:#FAEEDA; color:#854F0B; }
  .c5 .card-count { background:#FAECE7; color:#993C1D; }
  .c6 .card-count { background:#FBEAF0; color:#993556; }
  .c7 .card-count { background:#EAF3DE; color:#3B6D11; }
  .c8 .card-count { background:#FCEBEB; color:#A32D2D; }
  .c9 .card-count { background:#F1EFE8; color:#5F5E5A; }
  .c10 .card-count { background:#E1F5EE; color:#085041; }
  .c11 .card-count { background:#EEEDFE; color:#3C3489; }
  .c12 .card-count { background:#FAEEDA; color:#633806; }

  .c1 .dot { background:#534AB7; }
  .c2 .dot { background:#0F6E56; }
  .c3 .dot { background:#185FA5; }
  .c4 .dot { background:#854F0B; }
  .c5 .dot { background:#993C1D; }
  .c6 .dot { background:#993556; }
  .c7 .dot { background:#3B6D11; }
  .c8 .dot { background:#A32D2D; }
  .c9 .dot { background:#5F5E5A; }
  .c10 .dot { background:#085041; }
  .c11 .dot { background:#3C3489; }
  .c12 .dot { background:#633806; }

  .expand-all { font-size:12px; color:var(--color-text-secondary); cursor:pointer; background:none; border:0.5px solid var(--color-border-secondary); border-radius:6px; padding:4px 10px; }
  .expand-all:hover { background:var(--color-background-secondary); }
  .summary-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:14px; }
  .summary-pill { font-size:11px; padding:3px 9px; border-radius:12px; font-weight:500; }
</style>

<div class="wrap">
  <h2 style="font-size:0;height:0;overflow:hidden">Java 面试知识点全览</h2>
  <div class="title-bar">
    <div style="width:36px;height:36px;border-radius:10px;background:#EEEDFE;display:flex;align-items:center;justify-content:center;font-size:20px">☕</div>
    <h2>Java 面试知识点全览</h2>
    <button class="expand-all" onclick="toggleAll()">展开全部</button>
  </div>

  <div class="summary-row">
    <span class="summary-pill" style="background:#EEEDFE;color:#534AB7">12 大类</span>
    <span class="summary-pill" style="background:#E1F5EE;color:#0F6E56">涵盖基础 → 架构</span>
    <span class="summary-pill" style="background:#E6F1FB;color:#185FA5">点击卡片展开小类</span>
  </div>

  <div class="grid" id="grid"></div>
</div>

<script>

let allOpen = false;

function toggleAll() {
  allOpen = !allOpen;
  document.querySelectorAll('.card-body').forEach(b => b.classList.toggle('open', allOpen));
  document.querySelectorAll('.chevron').forEach(c => c.classList.toggle('open', allOpen));
  document.querySelector('.expand-all').textContent = allOpen ? '收起全部' : '展开全部';
}

function toggle(idx) {
  const body = document.getElementById('body-'+idx);
  const ch = document.getElementById('ch-'+idx);
  body.classList.toggle('open');
  ch.classList.toggle('open');
}

const grid = document.getElementById('grid');
categories.forEach((cat, i) => {
  const card = document.createElement('div');
  card.className = 'card ' + cat.cls;
  card.innerHTML = `
    <div class="card-header" onclick="toggle(${i})">
      <div class="card-icon">${cat.icon}</div>
      <div class="card-title">${cat.title}</div>
      <span class="card-count">${cat.subs.length} 项</span>
      <span class="chevron" id="ch-${i}">▼</span>
    </div>
    <div class="card-body" id="body-${i}">
      <ul class="sub-list">
        ${cat.subs.map(s => `<li><span class="dot"></span><span>${s}</span></li>`).join('')}
      </ul>
    </div>
  `;
  grid.appendChild(card);
});
</script>

</html>
