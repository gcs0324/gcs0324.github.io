<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>词汇闪过 · 原书页面版</title>
  <script src="../shared/theme.js"></script>
  <link rel="stylesheet" href="../shared/theme.css">
  <style>
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0; background: var(--bg); color: var(--tx);
      font-family: Inter, system-ui, -apple-system, "PingFang SC", sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* --pgw is how wide the scans are shown; the 大/中/小 buttons set it. */
    :root { --bar: 54px; --side: 264px; --pgw: 900px; }
    body[data-pgw="mid"]  { --pgw: 675px; }
    body[data-pgw="slim"] { --pgw: 450px; }

    /* ── tier accents ───────────────────────────────────────────── */
    [data-tier="core"]  { --tier: var(--purple); --tier-bg: var(--pur-bg); --tier-b: var(--pur-b); }
    [data-tier="mid"]   { --tier: var(--blue);   --tier-bg: var(--blu-bg); --tier-b: var(--blu-b); }
    [data-tier="low"]   { --tier: var(--teal);   --tier-bg: var(--teal-bg); --tier-b: var(--teal-b); }
    [data-tier="rare"]  { --tier: var(--amber);  --tier-bg: var(--amber-bg); --tier-b: var(--amber-b); }
    [data-tier="basic"] { --tier: var(--green);  --tier-bg: var(--grn-bg); --tier-b: var(--grn-b); }
    [data-tier="extra"] { --tier: var(--pink);   --tier-bg: var(--pink-bg); --tier-b: var(--pink-b); }

    /* ── top bar ────────────────────────────────────────────────── */
    .bar {
      position: sticky; top: 0; z-index: 60; height: var(--bar);
      display: flex; align-items: center; gap: 10px; padding: 0 62px 0 14px;
      background: color-mix(in srgb, var(--bg2) 86%, transparent);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
      border-bottom: 1px solid var(--bd);
    }
    .bar .back {
      display: grid; place-items: center; width: 32px; height: 32px; flex: 0 0 auto;
      border: 1px solid var(--bd); border-radius: 9px; background: var(--bg2);
      color: var(--tx2); text-decoration: none; font-size: 15px;
    }
    .bar .back:hover { border-color: var(--bd2); color: var(--tx); }
    .brand { font-weight: 750; font-size: 15px; letter-spacing: -.01em; white-space: nowrap; }
    .brand em { font-style: normal; color: var(--tx3); font-weight: 500; font-size: 12px; margin-left: 6px; }
    .bar .grow { flex: 1 1 auto; }

    .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
    .tabs::-webkit-scrollbar { display: none; }
    .tabs button {
      flex: 0 0 auto; padding: 6px 11px; border: 1px solid transparent; border-radius: 8px;
      background: transparent; color: var(--tx2); font: 650 12.5px/1 Inter, sans-serif;
      cursor: pointer; white-space: nowrap;
    }
    .tabs button:hover { background: var(--bg3); color: var(--tx); }
    .tabs button.on { background: var(--tier-bg); border-color: var(--tier-b); color: var(--tier); }

    .icon-btn {
      display: inline-flex; align-items: center; gap: 7px; height: 32px; padding: 0 11px;
      border: 1px solid var(--bd); border-radius: 9px; background: var(--bg2);
      color: var(--tx2); font: 600 12.5px/1 Inter, sans-serif; cursor: pointer;
    }
    .icon-btn:hover { border-color: var(--bd2); color: var(--tx); }
    .icon-btn kbd {
      padding: 1px 5px; border: 1px solid var(--bd); border-radius: 4px;
      background: var(--bg3); color: var(--tx3); font: 600 10px/1.4 "IBM Plex Mono", monospace;
    }
    .size { display: flex; border: 1px solid var(--bd); border-radius: 9px; overflow: hidden; }
    .size button {
      height: 30px; padding: 0 9px; border: 0; background: var(--bg2); color: var(--tx2);
      font: 600 12px/1 Inter, "PingFang SC", sans-serif; cursor: pointer;
    }
    .size button + button { border-left: 1px solid var(--bd); }
    .size button:hover { color: var(--tx); }
    .size button.on { background: var(--tier-bg); color: var(--tier); font-weight: 700; }
    .pager { display: flex; align-items: center; gap: 6px; }
    .pager input {
      width: 54px; height: 32px; padding: 0 8px; text-align: center;
      border: 1px solid var(--bd); border-radius: 9px; background: var(--bg2); color: var(--tx);
      font: 600 12.5px/1 "IBM Plex Mono", monospace;
    }
    .pager input:focus { outline: 2px solid var(--tier); outline-offset: 1px; }
    .pager label { color: var(--tx3); font: 600 11px/1 "IBM Plex Mono", monospace; }
    #menuBtn { display: none; }

    /* ── shell ──────────────────────────────────────────────────── */
    .shell { display: grid; grid-template-columns: var(--side) minmax(0, 1fr); align-items: start; }

    .side {
      position: sticky; top: var(--bar); height: calc(100vh - var(--bar));
      overflow-y: auto; overscroll-behavior: contain;
      padding: 14px 10px 60px; border-right: 1px solid var(--bd);
      background: var(--bg);
    }
    .side .grp { margin: 14px 0 6px; padding: 0 8px; color: var(--tx3);
      font: 700 10.5px/1 "IBM Plex Mono", monospace; letter-spacing: .1em; text-transform: uppercase; }
    .side .grp:first-child { margin-top: 2px; }
    .side a {
      display: block; padding: 7px 10px; border-radius: 8px; border: 1px solid transparent;
      color: var(--tx2); text-decoration: none; font-size: 13px; line-height: 1.35;
    }
    .side a:hover { background: var(--bg3); color: var(--tx); }
    .side a.on { background: var(--tier-bg); border-color: var(--tier-b); color: var(--tier); font-weight: 650; }
    .side a small { display: block; color: var(--tx3); font: 500 11px/1.4 "IBM Plex Mono", monospace; margin-top: 2px; }
    .side a.on small { color: var(--tier); opacity: .8; }

    main { min-width: 0; padding: 22px 0 90px; }
    .unit-head {
      max-width: var(--pgw); margin: 0 auto 18px; padding: 0 20px 0 56px;
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 10px;
    }
    .unit-head h1 { margin: 0; font-size: 20px; letter-spacing: -.02em; }
    .unit-head .tag {
      padding: 4px 9px; border: 1px solid var(--tier-b); border-radius: 999px;
      background: var(--tier-bg); color: var(--tier);
      font: 650 11px/1.3 "IBM Plex Mono", monospace;
    }
    .unit-head .range { color: var(--tx3); font: 500 12px/1.3 "IBM Plex Mono", monospace; }

    .pages { max-width: var(--pgw); margin: 0 auto; padding: 0 20px 0 56px; }
    .pg { position: relative; margin: 0 0 22px; scroll-margin-top: calc(var(--bar) + 14px); }
    .pg img {
      display: block; width: 100%; height: auto; border: 1px solid var(--bd);
      border-radius: 10px; background: #fff; cursor: zoom-in;
      box-shadow: 0 1px 3px rgba(0,0,0,.06);
    }
    [data-theme="dark"] .pg img { box-shadow: 0 2px 14px rgba(0,0,0,.4); }
    .pg .num {
      position: absolute; left: -46px; top: 2px; width: 38px; text-align: right;
      color: var(--tx3); font: 600 11.5px/1 "IBM Plex Mono", monospace;
    }
    .pg.flash img { box-shadow: 0 0 0 3px var(--tier); }

    .unit-foot {
      max-width: var(--pgw); margin: 30px auto 0; padding: 0 20px 0 56px;
      display: flex; gap: 10px; justify-content: space-between;
    }
    .unit-foot a, .unit-foot button {
      flex: 1 1 0; padding: 14px 16px; border: 1px solid var(--bd); border-radius: 12px;
      background: var(--bg2); color: var(--tx); text-decoration: none; cursor: pointer;
      font: 600 13.5px/1.4 Inter, sans-serif; text-align: left;
    }
    .unit-foot a:hover, .unit-foot button:hover { border-color: var(--tier); }
    .unit-foot a span, .unit-foot button span {
      display: block; color: var(--tx3); font: 500 11px/1.5 "IBM Plex Mono", monospace; margin-top: 3px;
    }
    .unit-foot .r { text-align: right; }

    /* ── search overlay ─────────────────────────────────────────── */
    .ov {
      position: fixed; inset: 0; z-index: 200; display: none;
      background: color-mix(in srgb, var(--bg) 72%, transparent);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
    }
    .ov.on { display: block; }
    .ov-panel {
      width: min(720px, calc(100% - 28px)); max-height: min(74vh, 700px);
      margin: 9vh auto 0; display: flex; flex-direction: column;
      border: 1px solid var(--bd2); border-radius: 16px;
      background: var(--bg2); box-shadow: 0 24px 70px rgba(0,0,0,.32); overflow: hidden;
    }
    .ov-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--bd); }
    .ov-head input {
      flex: 1 1 auto; border: 0; background: transparent; color: var(--tx);
      font: 500 16px/1.4 Inter, sans-serif; outline: none;
    }
    .ov-head input::placeholder { color: var(--tx3); }
    .ov-head .hint { color: var(--tx3); font: 600 11px/1 "IBM Plex Mono", monospace; white-space: nowrap; }
    .ov-body { overflow-y: auto; overscroll-behavior: contain; }
    .ov-note { padding: 26px 18px; color: var(--tx3); font-size: 13px; text-align: center; }
    .hit {
      display: block; width: 100%; padding: 12px 16px; border: 0; border-bottom: 1px solid var(--bd);
      background: transparent; color: inherit; text-align: left; cursor: pointer; font-family: inherit;
    }
    .hit:hover, .hit.sel { background: var(--bg3); }
    .hit .top { display: flex; align-items: baseline; gap: 8px; margin-bottom: 5px; }
    .hit .pno { color: var(--tier); font: 700 12px/1 "IBM Plex Mono", monospace; }
    .hit .un { color: var(--tx3); font: 500 11.5px/1.3 "IBM Plex Mono", monospace; }
    .hit .snippet {
      color: var(--tx2); font-size: 12.5px; line-height: 1.65;
      display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    }
    .hit mark { background: var(--yel-bg); color: var(--yel); border-radius: 3px; padding: 0 2px; }

    /* ── zoom lightbox ──────────────────────────────────────────── */
    .lb { position: fixed; inset: 0; z-index: 300; display: none; overflow: auto;
      background: rgba(0,0,0,.92); cursor: zoom-out; }
    .lb.on { display: block; }
    .lb img { display: block; margin: 0 auto; max-width: none; }
    .lb .close { position: fixed; top: 14px; right: 16px; z-index: 2;
      width: 38px; height: 38px; border-radius: 50%; border: 1px solid rgba(255,255,255,.3);
      background: rgba(0,0,0,.5); color: #fff; font-size: 19px; cursor: pointer; }

    .boot { padding: 90px 20px; text-align: center; color: var(--tx3); font-size: 14px; }
    .boot code { display: inline-block; margin-top: 10px; padding: 6px 10px; border: 1px solid var(--bd);
      border-radius: 7px; background: var(--bg3); color: var(--tx); font: 600 12.5px/1.5 "IBM Plex Mono", monospace; }
    .toast {
      position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 20px);
      z-index: 400; padding: 10px 16px; border: 1px solid var(--bd2); border-radius: 10px;
      background: var(--bg2); color: var(--tx); font-size: 13px; opacity: 0;
      pointer-events: none; transition: opacity .2s, transform .2s;
    }
    .toast.on { opacity: 1; transform: translate(-50%, 0); }

    @media (max-width: 900px) {
      :root { --side: 0px; }
      .shell { grid-template-columns: minmax(0, 1fr); }
      .side {
        position: fixed; top: var(--bar); left: 0; z-index: 80; width: 280px;
        transform: translateX(-102%); transition: transform .22s ease;
        box-shadow: 0 10px 40px rgba(0,0,0,.25);
      }
      body.nav .side { transform: none; }
      body.nav::after { content: ""; position: fixed; inset: var(--bar) 0 0; z-index: 70;
        background: rgba(0,0,0,.35); }
      #menuBtn { display: inline-flex; }
      .pg .num { position: static; width: auto; text-align: left; margin: 0 0 5px; }
      .tabs { display: none; }
      main { padding-top: 16px; }
      .pages, .unit-head, .unit-foot { padding: 0 12px; }
    }
    @media (max-width: 700px) { .size { display: none; } }

    @media (max-width: 560px) {
      .brand em, .pager label { display: none; }
    }
    @media print { .bar, .side, .ov, .lb, .unit-foot, .pg .num { display: none; } }
  </style>
</head>
<body>
  <header class="bar">
    <a class="back" href="../index.html" title="返回首页">←</a>
    <button class="icon-btn" id="menuBtn" title="目录">☰</button>
    <div class="brand">词汇闪过<em id="brandSub"></em></div>
    <div class="grow"></div>
    <nav class="tabs" id="tabs"></nav>
    <div class="size" id="size" role="group" aria-label="页面大小">
      <button type="button" data-pgw="wide" title="大">大</button>
      <button type="button" data-pgw="mid" title="中">中</button>
      <button type="button" data-pgw="slim" title="小">小</button>
    </div>
    <div class="pager">
      <label for="jump">P</label>
      <input id="jump" type="text" inputmode="numeric" placeholder="—" title="跳转页码 (1–662)">
    </div>
    <button class="icon-btn" id="searchBtn" title="全文搜索">🔍 搜索 <kbd>/</kbd></button>
  </header>

  <div class="shell">
    <aside class="side" id="side"></aside>
    <main id="reader"><div class="boot">正在载入书页…</div></main>
  </div>

  <div class="ov" id="ov">
    <div class="ov-panel">
      <div class="ov-head">
        <input id="q" type="search" placeholder="搜索单词、释义或关键词…" autocomplete="off">
        <span class="hint" id="qhint">Esc 关闭</span>
      </div>
      <div class="ov-body" id="hits"></div>
    </div>
  </div>

  <div class="lb" id="lb"><button class="close" title="关闭">✕</button><img id="lbImg" alt=""></div>
  <div class="toast" id="toast"></div>

        "<br><br>这一版是按原书 PDF 页面索引的，图片体积很大，" +
        "<br>浏览器不允许在 <b>file://</b> 下远程读取数据。" +
        "<br>请在项目根目录起一个本地服务再打开：<br>" +
        '<code>python3 -m http.server 8080</code><br>' +
        "然后访问 <code>http://localhost:8080/doc/kaoyan-vocab-book-pages.html</code>" +
        "<br><br>想要双击就能看的话，请用 <b>数字化全书</b> 那一版。" +
        "</div>";
    });

  /* ── chrome ───────────────────────────────────────────────── */
  function buildTabs() {
    var seen = [], box = $("#tabs");
    book.units.forEach(function (u) { if (seen.indexOf(u.tierSlug) < 0) seen.push(u.tierSlug); });
    seen.forEach(function (slug) {
      var sample = book.units.filter(function (u) { return u.tierSlug === slug; })[0];
      var b = document.createElement("button");
      b.textContent = sample.tier;
      b.dataset.slug = slug;
      b.onclick = function () {
        openUnit(book.units.filter(function (u) { return u.tierSlug === slug; })[0].id);
      };
      box.appendChild(b);
    });
  }

  function buildSide() {
    var side = $("#side"), lastGrp = null;
    book.units.forEach(function (u) {
      if (u.tier !== lastGrp) {
        lastGrp = u.tier;
        var g = document.createElement("div");
        g.className = "grp";
        g.textContent = u.tier;
        side.appendChild(g);
      }
      var a = document.createElement("a");
      a.href = "#unit=" + u.id;
      a.dataset.unit = u.id;
      var L = unitLabel(u);
      a.appendChild(document.createTextNode(L.t));
      var s = document.createElement("small");
      s.textContent = L.s;
      a.appendChild(s);
      a.onclick = function (ev) {
        ev.preventDefault();
        openUnit(u.id);
        document.body.classList.remove("nav");
      };
      side.appendChild(a);
    });
  }

  function markActive() {
    var links = $("#side").querySelectorAll("a");
    for (var i = 0; i < links.length; i++) {
      links[i].classList.toggle("on", links[i].dataset.unit === curUnit);
    }
    var u = unitsById[curUnit];
    var tabs = $("#tabs").querySelectorAll("button");
    for (var j = 0; j < tabs.length; j++) {
      tabs[j].classList.toggle("on", tabs[j].dataset.slug === u.tierSlug);
    }
    document.documentElement.setAttribute("data-tier", u.tierSlug);
  }

  /* ── unit rendering ───────────────────────────────────────── */
  function openUnit(id, gotoPage) {
    var u = unitsById[id];
    if (!u) return;
    curUnit = id;
    markActive();
    $("#brandSub").textContent = u.tier + " · " + u.pageCount + " 页";

    var host = $("#reader");
    host.innerHTML = "";

    var head = document.createElement("div");
    head.className = "unit-head";
    var h1 = document.createElement("h1");
    h1.textContent = unitTitle(u);
    var tag = document.createElement("span");
    tag.className = "tag";
    tag.textContent = u.tier;
    var rg = document.createElement("span");
    rg.className = "range";
    rg.textContent = "书 p" + u.pageFrom + "–" + u.pageTo + "　·　共 " + u.pageCount + " 页";
    head.appendChild(h1); head.appendChild(tag); head.appendChild(rg);
    host.appendChild(head);

    var wrap = document.createElement("div");
    wrap.className = "pages";
    pagesByUnit[id].forEach(function (p) {
      var d = document.createElement("div");
      d.className = "pg";
      d.id = "p" + p.n;
      d.dataset.page = p.n;
      var n = document.createElement("div");
      n.className = "num";
      n.textContent = "p" + pad(p.n);
      var img = document.createElement("img");
      img.loading = "lazy";
      img.decoding = "async";
      img.width = p.w; img.height = p.h;
      img.alt = "第 " + p.n + " 页";
      img.src = pageURL(p.n);
      img.onclick = function () { zoom(p.n); };
      d.appendChild(n); d.appendChild(img);
      wrap.appendChild(d);
    });
    host.appendChild(wrap);

    var idx = book.units.map(function (x) { return x.id; }).indexOf(id);
    var foot = document.createElement("div");
    foot.className = "unit-foot";
    if (idx > 0) {
      var pv = book.units[idx - 1];
      var a1 = document.createElement("a");
      a1.href = "#unit=" + pv.id;
      a1.innerHTML = "← 上一单元<span>" + unitTitle(pv) + "</span>";
      a1.onclick = function (ev) { ev.preventDefault(); openUnit(pv.id); };
      foot.appendChild(a1);
    } else { foot.appendChild(document.createElement("span")); }
    if (idx < book.units.length - 1) {
      var nx = book.units[idx + 1];
      var a2 = document.createElement("a");
      a2.className = "r";
      a2.href = "#unit=" + nx.id;
      a2.innerHTML = "下一单元 →<span>" + unitTitle(nx) + "</span>";
      a2.onclick = function (ev) { ev.preventDefault(); openUnit(nx.id); };
      foot.appendChild(a2);
    }
    host.appendChild(foot);

    try { history.replaceState(null, "", "#unit=" + id); } catch (e) {}
    if (gotoPage && pageIndex[gotoPage] && pageIndex[gotoPage].id === id) {
      jumpTo(gotoPage, true);
    } else {
      window.scrollTo({ top: 0 });
      setJump(u.pageFrom);
    }
    save();
  }

  function setJump(n) { $("#jump").value = n; }

  function jumpTo(n, flash) {
    var u = findUnitOfPage(n);
    if (!u) return;
    // another unit's page is not in the DOM yet, so switch first and let
    // openUnit come back here for the scroll
    if (u.id !== curUnit) { openUnit(u.id, n); return; }
    var el = document.getElementById("p" + n);
    if (!el) return;
    el.scrollIntoView({ behavior: "smooth", block: "start" });
    setJump(n);
    if (flash) {
      el.classList.add("flash");
      setTimeout(function () { el.classList.remove("flash"); }, 1400);
    }
    save();
  }

  function save() {
    if (!curUnit) return;
    var top = window.scrollY + 90;
    var best = null, bestD = Infinity;
    var all = document.querySelectorAll(".pg");
    for (var i = 0; i < all.length; i++) {
      var d = Math.abs(all[i].offsetTop - top);
      if (all[i].offsetTop <= top && d < bestD) { bestD = d; best = all[i]; }
    }
    try {
      localStorage.setItem(LASTKEY, JSON.stringify({
        unit: curUnit, page: best ? Number(best.dataset.page) : unitsById[curUnit].pageFrom
      }));
    } catch (e) {}
  }

  /* ── scroll spy ───────────────────────────────────────────── */
  var spy = null;
  window.addEventListener("scroll", function () {
    if (!curUnit) return;
    clearTimeout(spy);
    spy = setTimeout(function () {
      var all = document.querySelectorAll(".pg");
      var top = window.scrollY + 120;
      var cur = null;
      for (var i = 0; i < all.length; i++) {
        if (all[i].offsetTop <= top) cur = all[i]; else break;
      }
      if (cur) { setJump(Number(cur.dataset.page)); save(); }
    }, 90);
  }, { passive: true });

  /* ── zoom ─────────────────────────────────────────────────── */
  function zoom(n) {
    var img = $("#lbImg");
    img.src = pageURL(n);
    img.style.width = "auto";
    img.style.maxWidth = "none";
    $("#lb").classList.add("on");
    document.body.style.overflow = "hidden";
  }
  function unzoom() {
    $("#lb").classList.remove("on");
    $("#lbImg").src = "";
    document.body.style.overflow = "";
  }
  $("#lb").onclick = unzoom;

  /* ── search ───────────────────────────────────────────────── */
  function loadText() {
    if (text) return Promise.resolve(text);
    if (textLoading) return textLoading;
    textLoading = Promise.resolve()
      .then(function () { text = embedded("text-data"); return text; });
    return textLoading;
  }

  function openSearch() { $("#ov").classList.add("on"); $("#q").focus(); $("#q").select(); }
  function closeSearch() { $("#ov").classList.remove("on"); }
  $("#searchBtn").onclick = function () { openSearch(); loadText(); };
  $("#ov").onclick = function (ev) { if (ev.target === $("#ov")) closeSearch(); };

  var qTimer = null;
  $("#q").addEventListener("input", function () {
    clearTimeout(qTimer);
    qTimer = setTimeout(runSearch, 130);
  });

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function runSearch() {
    var q = $("#q").value.trim();
    var box = $("#hits");
    if (q.length < 1) {
      box.innerHTML = '<div class="ov-note">输入单词或中文释义，跨全书画线检索。</div>';
      hits = []; return;
    }
    box.innerHTML = '<div class="ov-note">检索中…</div>';
    loadText().then(function (t) {
      var needle = q.toLowerCase();
      var out = [], total = 0;
      for (var k in t) {
        var hay = t[k].toLowerCase();
        var at = hay.indexOf(needle);
        if (at < 0) continue;
        total++;
        if (out.length < 400) out.push({ n: Number(k), at: at, src: t[k] });
      }
      out.sort(function (a, b) { return a.n - b.n; });
      hits = out; sel = 0; hitTotal = total;
      renderHits(needle);
    });
  }

  function renderHits(needle) {
    var box = $("#hits");
    if (!hits.length) {
      box.innerHTML = '<div class="ov-note">没有匹配。共检索 ' +
        (text ? Object.keys(text).length : 0) + " 页。</div>";
      return;
    }
    box.innerHTML = "";
    hits.slice(0, 120).forEach(function (h, i) {
      var u = findUnitOfPage(h.n) || {};
      var a = Math.max(0, h.at - 42), b = Math.min(h.src.length, h.at + 78);
      var frag = (a > 0 ? "…" : "") + h.src.slice(a, h.at) +
                 "[" + h.src.slice(h.at, h.at + needle.length) + "]" +
                 h.src.slice(h.at + needle.length, b) + (b < h.src.length ? "…" : "");
      var btn = document.createElement("button");
      btn.className = "hit" + (i === 0 ? " sel" : "");
      btn.innerHTML =
        '<span class="top"><span class="pno">p' + pad(h.n) + "</span>" +
        '<span class="un">' + esc((u.tier || "") + " · " + (u.kind || "")) + "</span></span>" +
        '<span class="snippet">' + esc(frag).replace(/\[(.+?)\]/, "<mark>$1</mark>") + "</span>";
      btn.onclick = function () { closeSearch(); jumpTo(h.n, true); };
      box.appendChild(btn);
    });
    if (hits.length > 120) {
      var more = document.createElement("div");
      more.className = "ov-note";
      more.textContent = "命中 " + hitTotal + " 页，仅显示前 120 条";
      box.appendChild(more);
    }
  }

  /* ── keyboard ─────────────────────────────────────────────── */
  document.addEventListener("keydown", function (ev) {
    var ae = document.activeElement;
    var typing = !!ae && /^(INPUT|TEXTAREA)$/.test(ae.tagName);

    if (ev.key === "Escape") {
      if ($("#lb").classList.contains("on")) { unzoom(); return; }
      if ($("#ov").classList.contains("on")) { closeSearch(); return; }
      document.body.classList.remove("nav");
      return;
    }

    if ($("#ov").classList.contains("on")) {
      if (ev.key === "ArrowDown" || ev.key === "ArrowUp") {
        ev.preventDefault();
        var all = $("#hits").querySelectorAll(".hit");
        if (!all.length) return;
        if (all[sel]) all[sel].classList.remove("sel");
        sel = Math.max(0, Math.min(all.length - 1, sel + (ev.key === "ArrowDown" ? 1 : -1)));
        if (all[sel]) { all[sel].classList.add("sel"); all[sel].scrollIntoView({ block: "nearest" }); }
      } else if (ev.key === "Enter" && hits[sel]) {
        closeSearch();
        jumpTo(hits[sel].n, true);
      }
      return;
    }

    if (typing) {
      if (ev.key === "Enter" && ae === $("#jump")) {
        var n = parseInt($("#jump").value, 10);
        if (n >= 1 && n <= book.totalPages) jumpTo(n, true);
        ae.blur();
      }
      return;
    }

    if (ev.key === "/") { ev.preventDefault(); openSearch(); loadText(); return; }
    if (ev.key === "ArrowRight" || ev.key === "j") { step(1); }
    if (ev.key === "ArrowLeft" || ev.key === "k") { step(-1); }
  });

  function step(dir) {
    var cur = parseInt($("#jump").value, 10);
    if (!isFinite(cur)) cur = unitsById[curUnit].pageFrom;
    var n = cur + dir;
    if (n < 1) return;
    if (n > book.totalPages) { toast("已经是最后一页"); return; }
    jumpTo(n);
  }

  /* ── how wide the scans are shown ─────────────────────────── */
  var SKEY = "vocabBookPgw";
  function setSize(v) {
    document.body.setAttribute("data-pgw", v);
    Array.prototype.forEach.call(document.querySelectorAll("#size button"), function (b) {
      b.classList.toggle("on", b.getAttribute("data-pgw") === v);
    });
    try { localStorage.setItem(SKEY, v); } catch (e) {}
  }
  Array.prototype.forEach.call(document.querySelectorAll("#size button"), function (b) {
    b.onclick = function () { setSize(b.getAttribute("data-pgw")); };
  });
  var savedSize = "wide";
  try { savedSize = localStorage.getItem(SKEY) || "wide"; } catch (e) {}
  setSize(savedSize);

  $("#jump").addEventListener("focus", function () { this.select(); });
  $("#menuBtn").onclick = function () { document.body.classList.toggle("nav"); };

  window.addEventListener("hashchange", function () {
    var m = /^#unit=(.+)$/.exec(location.hash);
    if (m && m[1] !== curUnit && unitsById[m[1]]) openUnit(m[1]);
  });
})();
</script>
</body>
</html>
