          - text: OpenAI 官方发布 Codex CLI 的 Claude Code 插件，实现从 Claude Code 中直接调用 Codex 进行代码审查或任务委派。这是首次有两家头部 AI 公司的编码工具以"插件"形态互操作，标志着 Agent 工具链进入"跨模型协作"时代。
