    - generic [ref=e17]:
      - generic [ref=e18]: 💬 核心矛盾
      - paragraph [ref=e19]:
        - text: LLM 的上下文窗口是
        - strong [ref=e20]: 固定大小的工作区
        - text: ，而真实协作中的信息是
        - strong [ref=e21]: 无限增长的
        - text: 。即使窗口扩大到 1M token，"大海捞针"测试也只能测单事实检索——多事实场景下平均召回率仅约
        - strong [ref=e22]: 60%
        - text: ，且模型在窗口中间位置的注意力显著下降（Lost in the Middle 效应）。
      - paragraph [ref=e23]:
        - text: 记忆系统的本质任务：
        - emphasis [ref=e24]: 从无限信息流中，把对当前决策最有价值的那一小撮信息捞出来，塞进有限的上下文窗口。
