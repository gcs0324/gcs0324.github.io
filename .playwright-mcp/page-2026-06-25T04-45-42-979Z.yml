    - generic [ref=e120]: Generative Agents · 三维评分与反思机制
    - generic [ref=e121]:
      - generic [ref=e122]: 💬 为什么重要
      - paragraph [ref=e123]:
        - text: Park et al. (UIST 2023) 的 Generative Agents 是
        - strong [ref=e124]: 第一个完整实现 LLM Agent 长期记忆系统的工程
        - text: 。它提出的三维评分公式（recency + importance + relevance）已经成为后续几乎所有 Agent 记忆检索的
        - strong [ref=e125]: 事实标准
        - text: 。配套的 Reflection 机制首次实现了"记忆的记忆"——Agent 不仅能记住发生了什么，还能对自己的经历进行反思和抽象。
    - generic [ref=e126]:
      - generic [ref=e127]:
        - generic [ref=e128]: 评分公式
        - generic [ref=e129]: Memory Stream 三维检索评分
      - generic [ref=e130]:
        - generic [ref=e131]:
          - generic [ref=e133]: R
          - generic [ref=e135]:
            - generic [ref=e136]: Recency（近因性）
            - generic [ref=e137]:
              - text: 公式：
              - code [ref=e138]: 0.995^h
              - text: ，h = 自上次访问以来的游戏小时数。指数衰减，值域 [0, 1]。越近访问的记忆得分越高。
        - generic [ref=e139]:
          - generic [ref=e141]: I
          - generic [ref=e143]:
            - generic [ref=e144]: Importance（重要性）
            - generic [ref=e145]: LLM 打分 1-10。Prompt：「1=琐事（刷牙），10=极其重要（分手/录取）」。写入记忆时评分一次，后续不更新。
        - generic [ref=e146]:
          - generic [ref=e148]: R
          - generic [ref=e149]:
            - generic [ref=e150]: Relevance（相关性）
            - generic [ref=e151]: 当前查询 embedding 与记忆 embedding 的余弦相似度。值域 [-1, 1]，需 min-max 归一化到 [0, 1]。
    - generic [ref=e152]: // 三维加权求和，默认权重均为 1.0 score = α · n(recency) + β · n(importance) + γ · n(relevance) // 关键配置 RECENCY_DECAY = 0.995 // 每小时指数衰减因子 REFLECTION_THRESHOLD = 150.0 // 触发反思的累积 importance 阈值
