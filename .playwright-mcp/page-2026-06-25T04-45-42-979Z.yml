    - generic [ref=e42]:
      - generic [ref=e43]: 💬 为什么先讲理论
      - paragraph [ref=e44]:
        - text: CoALA（Cognitive Architectures for Language Agents，Sumers & Yao, TMLR 2024）是
        - strong [ref=e45]: 第一篇系统化梳理 LLM Agent 认知架构的学术论文
        - text: 。它提出的四种记忆分类——Working / Episodic / Semantic / Procedural——已成为业内讨论 Agent 记忆的通用语言。理解 CoALA 后再看各框架实现，会发现它们都在这个框架的不同位置做了取舍。
      - paragraph [ref=e46]:
        - text: CoALA 的理论来源是
        - strong [ref=e47]: SOAR 认知架构
        - text: （非 ACT-R），核心创新是用
        - strong [ref=e48]: 自然语言统一所有内部表示
        - text: ，用 LLM 替代手写产生式规则。
