          - generic [ref=e975]: "/* 快排划分 - 必手写！Hoare或挖坑法 */ int Partition(int A[], int low, int high) { int pivot = A[low]; // 取第一个为枢轴 while (low < high) { while (low < high && A[high] >= pivot) high--; A[low] = A[high]; // 比枢轴小的移到左边 while (low < high && A[low] <= pivot) low++; A[high] = A[low]; // 比枢轴大的移到右边 } A[low] = pivot; // 枢轴归位 return low; // 返回枢轴位置 } void QuickSort(int A[], int low, int high) { if (low < high) { int pos = Partition(A, low, high); QuickSort(A, low, pos - 1); QuickSort(A, pos + 1, high); } }"
